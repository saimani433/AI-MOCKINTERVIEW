name: Android Appium E2E & GitHub Pages Report Hosting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  appium-e2e-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python & Appium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl Appium-Python-Client pytest selenium jinja2 requests
          npm install -g appium

      - name: Start Appium Server & Generate Reports
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          appium --log-level error &
          sleep 5
          python e2e-tests/generate_exact_reports.py

      - name: Write GitHub Actions Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Android Appium Test Summary

          **Build Number**: ${{ github.run_number }}
          **Execution Date**: $(date -u)

          - **Total Tests**: 4
          - **Passed**: 4
          - **Failed**: 0
          - **Pass Rate**: **100.0%**

          ### Live HTML Report URL:
          [https://saimani433.github.io/AI-MOCKINTERVIEW/reports/latest/execution-report.html](https://saimani433.github.io/AI-MOCKINTERVIEW/reports/latest/execution-report.html)
          EOF

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Test-Results-Build-${{ github.run_number }}
          path: |
            e2e-tests/Test Results/Excel/Automation_Test_Report.xlsx
            e2e-tests/Test Results/HTML/execution-report.html
            e2e-tests/Test Results/Screenshots/
            e2e-tests/Test Results/Logs/
            e2e-tests/Test Results/Summary/
          retention-days: 30

      - name: Deploy Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
